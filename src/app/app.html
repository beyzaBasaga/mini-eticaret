<!-- SET örneği -->
<h2>SET Örneği</h2>
<p>Count: {{ countSet() }}</p>
<button (click)="incrementSet()">Artır</button>
<hr />

<!-- UPDATE örneği -->
<h2>UPDATE Örneği</h2>
<p>Count: {{ countUpdate() }}</p>
<button (click)="incrementUpdate()">Artır</button>
<hr />

<!-- COMPUTED örneği -->
<h2>COMPUTED Örneği</h2>
<p>Fiyat: {{ price() }} TL</p>
<p>KDV Oranı: {{ taxRate() * 100 }}%</p>
<p>Toplam: {{ total() }} TL</p>
<hr />

<!-- EFFECT örneği -->
<h2>EFFECT Örneği</h2>
<p>İsim: {{ name() }}</p>
<input [(ngModel)]="nameInput" placeholder="Yeni isim gir" />
<button (click)="changeName()">Değiştir</button>
<hr />
