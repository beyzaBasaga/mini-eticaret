<div class="container">
  <!-- Interpolation -->
  <h2>Interpolation Örneği</h2>
  <p>Merhaba, {{ userName }}!</p>
  <!-- Pipe -->
  <p>Fiyat= {{ fiyat | currency }}</p>
  <hr>

  <!-- Property Binding -->
  <h2>Property Binding Örneği</h2>
  <img [src]="profileImage" alt="Angular Logo" width="150">
  <hr>

  <!-- Event Binding -->
  <h2>Event Binding Örneği</h2>
  <p>Sayac: {{ count }}</p>
  <button (click)="increase()">Arttır</button>
  <hr>

  <!-- Two-way Binding -->
  <h2>Two-way Binding Örneği</h2>
  <input [(ngModel)]="userName2" placeholder="Adınızı yazın">
  <p>Güncel isim: {{ userName2 }}</p>
</div>
